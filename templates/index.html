<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduGenie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 36px;
        }

        header p {
            margin: 0;
            font-size: 17px;
            opacity: 0.9;
        }

        .container {
            width: min(1100px, 92%);
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #4f46e5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
        }

        input:focus,
        textarea:focus {
            border-color: #4f46e5;
            box-shadow:
                0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 8px;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .output {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #f8fafc;
            border-left: 5px solid #4f46e5;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
            overflow-x: auto;
        }

        .loading {
            color: #6b7280;
            font-style: italic;
        }

        .error {
            color: #b91c1c;
            background: #fef2f2;
            border-left-color: #dc2626;
        }

        .success {
            color: #166534;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .status {
            text-align: center;
            margin-bottom: 25px;
        }

        .status span {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 14px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            .card {
                padding: 18px;
            }

            button {
                width: 100%;
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 EduGenie</h1>
    <p>Your AI-powered learning assistant</p>
</header>


<div class="container">

    <div class="status">
        <span id="server-status">
            Checking server...
        </span>
    </div>


    <!-- =================================================
         Q&A
         ================================================= -->

    <div class="card">

        <h2>💬 Ask EduGenie</h2>

        <label for="question">
            Ask a question
        </label>

        <input
            type="text"
            id="question"
            placeholder="For example: Explain photosynthesis"
        >

        <button
            id="ask-button"
            onclick="askQuestion()"
        >
            Ask Question
        </button>

        <div
            id="qa-output"
            class="output"
        ></div>

    </div>


    <div class="grid">

        <!-- =================================================
             Explain
             ================================================= -->

        <div class="card">

            <h2>📚 Explain a Concept</h2>

            <label for="explain-topic">
                Topic
            </label>

            <input
                type="text"
                id="explain-topic"
                placeholder="Enter a topic"
            >

            <button
                id="explain-button"
                onclick="explainConcept()"
            >
                Explain
            </button>

            <div
                id="explain-output"
                class="output"
            ></div>

        </div>


        <!-- =================================================
             Learning Path
             ================================================= -->

        <div class="card">

            <h2>🗺️ Learning Path</h2>

            <label for="learning-topic">
                Topic
            </label>

            <input
                type="text"
                id="learning-topic"
                placeholder="Enter a topic"
            >

            <button
                id="learning-button"
                onclick="createLearningPath()"
            >
                Create Path
            </button>

            <div
                id="learning-output"
                class="output"
            ></div>

        </div>


        <!-- =================================================
             Quiz
             ================================================= -->

        <div class="card">

            <h2>📝 Generate Quiz</h2>

            <label for="quiz-topic">
                Topic
            </label>

            <input
                type="text"
                id="quiz-topic"
                placeholder="Enter a topic"
            >

            <button
                id="quiz-button"
                onclick="generateQuiz()"
            >
                Generate Quiz
            </button>

            <div
                id="quiz-output"
                class="output"
            ></div>

        </div>


        <!-- =================================================
             Summary
             ================================================= -->

        <div class="card">

            <h2>📄 Summarize Text</h2>

            <label for="summary-text">
                Text
            </label>

            <textarea
                id="summary-text"
                placeholder="Paste at least 20 characters of text here..."
            ></textarea>

            <button
                id="summary-button"
                onclick="summarizeText()"
            >
                Summarize
            </button>

            <div
                id="summary-output"
                class="output"
            ></div>

        </div>

    </div>

</div>


<footer>
    EduGenie &copy; 2026
</footer>


<script>

    // =====================================================
    // Generic API helper
    // =====================================================

    async function callAPI(
        url,
        data,
        outputElement,
        buttonElement,
        loadingMessage = "Thinking..."
    ) {

        outputElement.style.display = "block";

        outputElement.className = "output loading";

        outputElement.textContent = loadingMessage;

        buttonElement.disabled = true;

        try {

            const response = await fetch(
                url,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)
                }
            );


            const result = await response.text();


            if (!response.ok) {

                outputElement.className =
                    "output error";

                outputElement.textContent =
                    "Error: " + result;

                return;
            }


            outputElement.className =
                "output success";

            outputElement.textContent =
                result;


        } catch (error) {

            outputElement.className =
                "output error";

            outputElement.textContent =
                "Unable to connect to the server.\n\n" +
                error.message;

        } finally {

            buttonElement.disabled = false;

        }
    }


    // =====================================================
    // Q&A
    // =====================================================

    async function askQuestion() {

        const question =
            document
                .getElementById("question")
                .value
                .trim();

        const output =
            document.getElementById(
                "qa-output"
            );

        const button =
            document.getElementById(
                "ask-button"
            );


        if (!question) {

            output.style.display = "block";

            output.className =
                "output error";

            output.textContent =
                "Please enter a question.";

            return;
        }


        await callAPI(
            "/qa",
            {
                question: question
            },
            output,
            button,
            "EduGenie is thinking..."
        );
    }


    // =====================================================
    // Explain
    // =====================================================

    async function explainConcept() {

        const topic =
            document
                .getElementById("explain-topic")
                .value
                .trim();

        const output =
            document.getElementById(
                "explain-output"
            );

        const button =
            document.getElementById(
                "explain-button"
            );


        if (!topic) {

            output.style.display = "block";

            output.className =
                "output error";

            output.textContent =
                "Please enter a topic.";

            return;
        }


        await callAPI(
            "/explain",
            {
                topic: topic
            },
            output,
            button,
            "Generating explanation..."
        );
    }


    // =====================================================
    // Learning Path
    // =====================================================

    async function createLearningPath() {

        const topic =
            document
                .getElementById("learning-topic")
                .value
                .trim();

        const output =
            document.getElementById(
                "learning-output"
            );

        const button =
            document.getElementById(
                "learning-button"
            );


        if (!topic) {

            output.style.display = "block";

            output.className =
                "output error";

            output.textContent =
                "Please enter a topic.";

            return;
        }


        await callAPI(
            "/learning-path",
            {
                topic: topic
            },
            output,
            button,
            "Creating your learning path..."
        );
    }


    // =====================================================
    // Quiz
    // =====================================================

    async function generateQuiz() {

        const topic =
            document
                .getElementById("quiz-topic")
                .value
                .trim();

        const output =
            document.getElementById(
                "quiz-output"
            );

        const button =
            document.getElementById(
                "quiz-button"
            );


        if (!topic) {

            output.style.display = "block";

            output.className =
                "output error";

            output.textContent =
                "Please enter a topic.";

            return;
        }


        await callAPI(
            "/quiz",
            {
                topic: topic
            },
            output,
            button,
            "Generating quiz..."
        );
    }


    // =====================================================
    // Summary
    // =====================================================

    async function summarizeText() {

        const text =
            document
                .getElementById("summary-text")
                .value
                .trim();

        const output =
            document.getElementById(
                "summary-output"
            );

        const button =
            document.getElementById(
                "summary-button"
            );


        if (text.length < 20) {

            output.style.display = "block";

            output.className =
                "output error";

            output.textContent =
                "Please enter at least 20 characters.";

            return;
        }


        await callAPI(
            "/summarize",
            {
                text: text
            },
            output,
            button,
            "Summarizing text..."
        );
    }


    // =====================================================
    // Check server
    // =====================================================

    async function checkServer() {

        const status =
            document.getElementById(
                "server-status"
            );

        try {

            const response =
                await fetch("/health");


            const data =
                await response.json();


            if (response.ok) {

                status.textContent =
                    "● EduGenie is online";

                status.style.background =
                    "#dcfce7";

                status.style.color =
                    "#166534";

            } else {

                throw new Error(
                    "Server unavailable"
                );

            }

        } catch (error) {

            status.textContent =
                "● Server unavailable";

            status.style.background =
                "#fee2e2";

            status.style.color =
                "#991b1b";
        }
    }


    // =====================================================
    // Enter key for Q&A
    // =====================================================

    document
        .getElementById("question")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    askQuestion();

                }

            }
        );


    // =====================================================
    // Start
    // =====================================================

    checkServer();

</script>

</body>
</html>
